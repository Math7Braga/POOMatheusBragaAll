# Sobe o PostgreSQL já com o banco exemplo_jpa criado:
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: exemplo_jpa_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: exemplo_jpa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
