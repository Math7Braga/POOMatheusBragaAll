# Opcional: sobe um PostgreSQL com o banco db_produtos já criado
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: db_produtos
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db_produtos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
